<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandala Policy Consulting | Rekrutmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#071433;--navy2:#0E2257;--nila:#6A55E0;--nila2:#A99BFF;--ink:#F1F2FF;--mute:#B4BCE4;--line:#2B3F86;--ok:#7FE0B0}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{min-height:100%;background:linear-gradient(180deg,#071433 0,#0A1B45 55%,#140F44 100%) fixed;color:var(--ink);font:16px/1.65 'Plus Jakarta Sans',system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 420px at 85% 5%,rgba(106,85,224,.28),transparent 70%),radial-gradient(600px 400px at 5% 60%,rgba(40,80,200,.22),transparent 70%)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2}
a{color:var(--nila2)}
:focus-visible{outline:3px solid var(--nila2);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 5vw;background:rgba(7,20,51,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header a.brand{display:flex;align-items:center;gap:10px;font:700 1.12rem Fraunces,serif;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;font-size:.93rem;padding:7px 14px;border-radius:99px;transition:background .2s,color .2s}
nav a:hover{color:var(--ink);background:rgba(169,155,255,.14)}
nav a.on{color:#fff;background:var(--nila)}
main{max-width:1040px;margin:0 auto;padding:40px 5vw 90px}
.hero{position:relative;text-align:center;padding:96px 0 80px}
.mandala{position:absolute;left:50%;top:50%;width:min(780px,140vw);transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
.mandala svg{width:100%;height:auto;animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero>:not(.mandala){position:relative}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);margin-bottom:18px;background:linear-gradient(90deg,#fff 30%,#C7BEFF);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.hero p{max-width:600px;margin:0 auto 28px;color:var(--mute);font-size:1.12rem}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:linear-gradient(160deg,rgba(26,48,118,.85),rgba(14,34,87,.9));border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 40px -22px #000}
a.card{display:block;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--nila2);transform:translateY(-4px)}
.card h3{font-size:1.28rem;margin-bottom:8px}
.card p,.card li{color:var(--mute)}
.card ul{padding-left:20px;margin:8px 0 18px}
.ic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#8A76F5,#3B2FA0);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 8px 20px -8px var(--nila)}
.ic svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-block;background:rgba(169,155,255,.18);color:#D9D3FF;border:1px solid var(--nila2);border-radius:99px;padding:2px 14px;font-size:.85rem;margin-bottom:14px}
.btn{display:inline-block;background:linear-gradient(135deg,#7C68F2,#4B3AC2);color:#fff;border:0;border-radius:12px;padding:13px 28px;font:600 1rem inherit;cursor:pointer;text-decoration:none;box-shadow:0 10px 24px -10px var(--nila);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px var(--nila2)}
.btn.ghost{background:rgba(169,155,255,.08);border:1px solid var(--nila2);color:var(--ink);box-shadow:none}
.st{font-size:1.7rem;text-align:center;margin:84px 0 8px}
.sub{text-align:center;color:var(--mute);max-width:560px;margin:0 auto 32px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative}
.flow:before{content:"";position:absolute;left:10%;right:10%;top:22px;height:2px;background:linear-gradient(90deg,var(--nila),var(--nila2));opacity:.5}
.fs{position:relative;text-align:center;font-size:.92rem;color:var(--mute)}
.fs b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 10px;border-radius:50%;background:var(--navy2);border:2px solid var(--nila2);color:#fff;font-family:Fraunces,serif}
.fs span{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.pr div{padding:20px;border-radius:14px;background:rgba(14,34,87,.6);border-left:3px solid var(--nila2);color:var(--mute);font-size:.94rem}
.pr b{display:block;color:var(--ink);margin-bottom:4px}
.job{border-top:4px solid var(--nila)}
.job.sr{border-top-color:var(--nila2)}
h2.pg{font-size:2.1rem;margin-bottom:28px}
h2.pg:after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--nila),var(--nila2));margin-top:12px}
h4{margin:18px 0 6px;color:var(--ink)}
label{display:block;margin:14px 0 6px;font-weight:500}
input,textarea,select{width:100%;background:rgba(7,20,51,.8);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit}
input:focus,textarea:focus{border-color:var(--nila2)}
input[type=file]{padding:9px}
textarea{min-height:120px;resize:vertical}
.hint{font-size:.88rem;color:var(--mute)}
.sec{margin-bottom:20px}
.sec h3{font-size:1.15rem;margin-bottom:4px}
.ok{color:var(--ok)}
.bad{color:#FFA3B5}
.steps{list-style:none;padding:0;margin:20px 0}
.steps li{padding:10px 14px 10px 40px;position:relative;color:var(--mute);border-left:2px solid var(--line);margin-left:10px}
.steps li:before{content:"";position:absolute;left:-9px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--navy);border:2px solid var(--line)}
.steps li.done{color:var(--ink);border-color:var(--nila2)}
.steps li.done:before{background:var(--nila2);border-color:var(--nila2)}
.steps li.fail{color:#FFA3B5;border-color:#FFA3B5}
.steps li.fail:before{background:#FFA3B5;border-color:#FFA3B5}
.slots{display:grid;gap:10px;margin:14px 0}
.slots label{display:flex;gap:10px;align-items:center;background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;cursor:pointer}
.slots input{width:auto}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500}
.box{background:rgba(7,20,51,.6);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.cd{font:700 1.6rem Fraunces,serif}
footer{text-align:center;color:var(--mute);font-size:.88rem;padding:26px;border-top:1px solid var(--line);background:rgba(7,20,51,.6)}
@media(max-width:820px){.flow{grid-template-columns:1fr;text-align:left}.flow:before{display:none}.fs{display:flex;gap:14px;align-items:center;text-align:left}.fs b{margin:0;flex:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

"MPC-GAGAL01":{nama:"Dina Lestari",posisi:"junior",ok:false,s:[82,70,68,75,78],rank:"14 dari 40 kandidat",pers:65,tgl:"Rabu, 30 September 2026",sang:"Senin, 5 Oktober 2026",
 cat:["Policy brief: struktur runtut, namun rekomendasi belum didukung data yang cukup kuat.","Tes kognitif: penalaran kuantitatif masih di bawah rata-rata peserta.","FGD dan wawancara: komunikasi baik, perlu lebih tegas mempertahankan argumen berbasis data."]}};
function ret(o){return o?`<p class="ok"><b>Talent Pool aktif (opt-in).</b> Dokumen dan identitas Anda tetap tersimpan terenkripsi paling lama 2 tahun, yaitu sampai 30 September 2028. Setelah itu sistem menghapusnya secara otomatis.</p>`:`<p><b>Tanpa persetujuan Talent Pool.</b> Pada <b>30 Oktober 2026</b> sistem menjalankan pembersihan otomatis: seluruh berkas (CV, portofolio, ijazah) dihapus dari penyimpanan, dan nama, NIK, serta email dianonimkan di basis data.</p>`}
function dv(d){
 const tot=d.s.reduce((t,v,i)=>t+v*W[i][1],0),p=JOBS[d.posisi];
 const st=STAGES.map((x,i)=>`<li class="${i<4?"done":d.ok?"done":"fail"}">${x}</li>`).join("");
 let h=`<div class="card" style="margin-top:20px"><span class="badge">${p.nama}</span><h3>Halo, ${d.nama}</h3><ol class="steps">${st}</ol>`;
 h+=d.ok?`<p class="ok"><b>Selamat!</b> Anda lolos seluruh tahap seleksi. Surat Penawaran Kerja (Job Offer) digital telah diterbitkan.</p>`:`<p class="bad"><b>Mohon maaf,</b> skor akhir Anda belum mencapai ambang batas kelulusan minimal 80. Terima kasih telah mengikuti seluruh proses seleksi.</p>`;
 h+=`<h4>Rincian skor</h4><table><tr><th>Tahap</th><th>Skor</th><th>Bobot</th><th>Kontribusi</th></tr>${W.map((w,i)=>`<tr><td>${w[0]}</td><td>${d.s[i]}</td><td>${w[1]*100}%</td><td>${(d.s[i]*w[1]).toFixed(2)}</td></tr>`).join("")}<tr><td><b>Skor akhir</b></td><td colspan="3"><b class="${d.ok?"ok":"bad"}">${tot.toFixed(2)}</b> dari 100</td></tr></table>
 <p class="hint">Peringkat: ${d.rank}. Posisi persentil: ${d.pers} (anonim).</p><h4>Catatan evaluator</h4><ul>${li(d.cat)}</ul>
 <div class="box"><b>Masa sanggah</b><p>Pengumuman hasil: ${d.tgl}. Anda dapat mengajukan sanggahan melalui portal sampai <b>${d.sang}</b> (3 hari kerja). Tim Audit Internal menjawab secara tertulis maksimal 3 hari kerja.</p></div>`;
 if(!d.ok)h+=`<div class="box"><b>Retensi dan penghapusan data</b><ol class="steps"><li class="done">30 Sep 2026: hasil diumumkan. Data Anda tersimpan terenkripsi untuk melayani sanggahan dan audit.</li><li class="done">5 Okt 2026: masa sanggah 3 hari kerja berakhir.</li><li>30 Okt 2026: masa retensi 30 hari berakhir, lalu data dihapus atau dianonimkan otomatis.</li></ol><p class="cd">28 hari lagi</p><p class="hint">sampai pembersihan data otomatis (hitungan dummy per 2 Okt 2026)</p>
 <label style="display:flex;gap:10px;align-items:center;font-weight:400"><input type="checkbox" id="optin" style="width:auto"> Saya bersedia masuk Talent Pool (simulasi persetujuan opt-in)</label><div id="ret">${ret(false)}</div></div>`;
 return h+`</div>`}
function status(a){
 const st=a.status;let h=`<div class="card" style="margin-top:20px"><span class="badge">${JOBS[a.posisi].nama}</span><h3>Halo, ${a.nama}</h3><ol class="steps">${STAGES.map((s,i)=>`<li class="${i<=st?"done":""}">${s}</li>`).join("")}</ol>`;
 if(st===0)h+=`<p>Lamaran Anda sedang dalam proses screening administrasi. Silakan cek kembali secara berkala.</p>`;
 if(st===1)h+=`<p class="ok"><b>Selamat!</b> Anda berhasil lolos tahap screening.</p><p>Lanjutkan ke tahap berikutnya.</p><br><a class="btn" href="#/tes">Mulai Tes Kognitif & Simulasi Policy Brief</a>`;
 if(st===2)h+=`<p class="ok"><b>Selamat!</b> Skor Anda mumpuni. Pilih satu jadwal Focus Group Discussion (FGD) di bawah.</p><form id="sf" class="slots">${SLOTS.map((s,i)=>`<label><input type="radio" name="slot" value="${s}" ${i?"":"required"}> ${s}</label>`).join("")}<button class="btn" type="submit">Konfirmasi jadwal</button></form>`;
 if(st>=3)h+=`<p class="ok"><b>Jadwal FGD Anda terkonfirmasi:</b></p><p>${a.slot}</p><p class="hint">Tautan sesi daring akan dikirim sebelum jadwal.</p>`;
 h+=`</div>`;
 return h}

function route(){
 const [,p,arg]=(location.hash||"#/").split("/");
 const app=document.getElementById("app");
 app.innerHTML=p==="tentang"?V.tentang():p==="lowongan"?V.lowongan():p==="lamar"?V.lamar(arg):p==="tracking"?V.tracking():p==="tes"?V.tes():p==="terima"?V.terima(arg):V.home();
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href").split("/")[1]===(p==="lamar"?"lowongan":p)));
 window.scrollTo(0,0);
}
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target;
 if(f.id==="f"){
  const kode="MPC-"+Math.random().toString(36).slice(2,8).toUpperCase();
  const a=db.get();a.push({kode,nama:f.nama.value,posisi:f.dataset.k,status:0,slot:""});db.set(a);
  /* TODO produksi: kirim data & berkas ke backend (Formspree/Supabase/Apps Script) */
  location.hash="#/terima/"+kode}
 if(f.id==="tf"){
  const kd=f.kode.value.trim().toUpperCase(),a=db.get().find(x=>x.kode===kd);
  if(DUM[kd]){document.getElementById("hasil").innerHTML=dv(DUM[kd]);return}
  document.getElementById("hasil").innerHTML=a?status(a):`<div class="card" style="margin-top:20px"><p>Kode lamaran tidak ditemukan. Periksa kembali kode Anda.</p></div>`;
  if(a)document.getElementById("hasil").dataset.kode=a.kode}
 if(f.id==="sf"){
  const kode=document.getElementById("hasil").dataset.kode;const arr=db.get();const a=arr.find(x=>x.kode===kode);
  a.slot=f.slot.value;a.status=3;db.set(arr);document.getElementById("hasil").innerHTML=status(a)}
});
document.addEventListener("change",e=>{if(e.target.id==="optin")document.getElementById("ret").innerHTML=ret(e.target.checked)});
addEventListener("hashchange",route);route();
</script>
</body>
